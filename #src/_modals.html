<div class="modals" style="--duration: 1s; --cubic: cubic-bezier(0.68, -0.55, 0.27, 1.55)">
    <div class="modal-overlay">
        <div class="modal modal-order" data-target="modal-order">
            <div class="modal__body">
                <div" class="modal__shell -column-center">
                    <form action="#" class="modal__content form">
                        <div class="modal__exit modal-close">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">

                                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2" d="m21 21l-9-9m0 0L3 3m9 9l9-9m-9 9l-9 9" />
                            </svg>
                        </div>
                        <div class="modal__title">
                            <h2>Оставить заявку</h2>
                        </div>
                        <div class="modal__column -column">
                            <div class="input">
                                <div class="input__box">
                                    <input data-required="" type="text" placeholder="Ваше имя *">
                                </div>
                                <div class="input__warning">
                                    Данное поле должно быть заполненно
                                </div>
                            </div>
                            <div class="input">
                                <div class="input__box">
                                    <input data-required="" type="email" placeholder="Ваш e-mail">
                                </div>
                                <div class="input__warning">
                                    Данное поле должно быть заполненно
                                </div>
                            </div>
                            <div class="input">
                                <div class="input__box">
                                    <input data-required="" data-phone="" type="tel" placeholder="Телефон">
                                </div>
                                <div class="input__warning">
                                    Данное поле должно быть заполненно
                                </div>
                            </div>
                            <button class="btn">
                                <span>Отправить</span>
                            </button>
                        </div>
                    </form>
            </div>
        </div>
    </div>
</div>
</div>
